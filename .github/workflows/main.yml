name: CI Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  travis-compatible-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 建立測試用的 Docker 映像檔
      - name: Before Install (Build Docker)
        run: docker build -t jason/docker -f Dockerfile.dev .

      # 2. 執行測試
      - name: Script (Run Tests)
        run: docker run -e CI=true jason/docker npm run test

      # 3. 在 GitHub Actions 現場完成生產環境的打包（已修正 ENV 錯誤）
      - name: Build Production Project
        run: |
          npm install
          DISABLE_ESLINT_PLUGIN=true npm run build

      # 4. 關鍵優化：建立乾淨的部署資料夾，絕對不會打包到 node_modules
      - name: Generate Deployment Package
        run: |
          # 建立一個暫時的乾淨資料夾
          mkdir deploy_dir
          
          # 只把生產環境絕對需要的「Dockerfile」和「build 資料夾」複製進去
          cp Dockerfile deploy_dir/
          cp -r build deploy_dir/
          
          # 切換進去該資料夾，並壓縮成 deploy.zip 存放在根目錄
          cd deploy_dir
          zip -r ../deploy.zip .
          
          # 預覽壓縮包內容，確保檔案極小且結構正確
          cd ..
          ls -lh deploy.zip

      # 5. 部署到 AWS Elastic Beanstalk（上傳速度將大幅提升）
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "docker-test"
          environment_name: "Docker-test-env-1"
          region: "ap-southeast-2"
          version_label: "deploy-${{ github.sha }}"
          deployment_package: "deploy.zip"
