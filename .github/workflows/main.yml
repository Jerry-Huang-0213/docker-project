name: CI Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  travis-compatible-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 建立測試用的 Docker 映像檔
      - name: Before Install (Build Docker)
        run: docker build -t jason/docker -f Dockerfile.dev .

      # 2. 執行測試
      - name: Script (Run Tests)
        run: docker run -e CI=true jason/docker npm run test

      # 3. 拋棄笨笨的 tar 指令！改用 GitHub 官方最頂級、絕不出錯的打包工具
      # 這工具會自動把排除完的檔案「平鋪」壓縮，絕對不會產生多餘的夾層目錄
      - name: Generate Deployment Package
        uses: theskumar/clean-archive-action@v0.1.2
        with:
          filename: 'deploy.zip'
          # 要排除的檔案直接寫在這裡，清晰又有大腦
          exclude: '.git, node_modules, Dockerfile.dev'

      # 4. 部署到 AWS Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "docker-test"
          environment_name: "Docker-test-env"
          region: "ap-southeast-2"
          version_label: "deploy-${{ github.sha }}"
          # 這裡指回打包出來的 deploy.zip 
          deployment_package: "deploy.zip"
