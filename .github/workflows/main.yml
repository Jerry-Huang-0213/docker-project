name: CI Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  travis-compatible-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 建立測試用的 Docker 映像檔
      - name: Before Install (Build Docker)
        run: docker build -t jason/docker -f Dockerfile.dev .

      # 2. 執行測試
      - name: Script (Run Tests)
        run: docker run -e CI=true jason/docker npm run test

      # 3. 關鍵優化：在 GitHub Actions 現場完成生產環境的打包！
      # 這樣可以產生完全獨立的 build 資料夾，不需要把整大包原始碼送去 AWS 現場編譯
      - name: Build Production Project
        run: |
          npm install
          ENV DISABLE_ESLINT_PLUGIN=true npm run build

      # 4. 只把「Dockerfile」和剛剛打包好的「build 資料夾」壓縮起來
      # 拒絕把 node_modules、src、public 等累贅原始碼送去 AWS
            # 3. 確保你最新修改的 Dockerfile 和專案原始碼被精準打包
      - name: Generate Deployment Package
        run: |
          # 強制檢查 Dockerfile 是否存在，預防路徑或檔名錯誤
          ls -la Dockerfile
          # 打包當前目錄，並徹底排除掉不需要的垃圾檔案
          zip -r deploy.zip . -x "*.git*" "node_modules/*" "Dockerfile.dev" "docker-compose.yaml" "deploy.zip"


      # 5. 部署到 AWS Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "docker-test"
          environment_name: "Docker-test-env"
          region: "ap-southeast-2"
          version_label: "deploy-${{ github.sha }}"
          deployment_package: "deploy.zip"
